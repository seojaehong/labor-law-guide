name: Daily News Update

on:
  schedule:
    # 매일 한국시간 09:00 (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 실행 가능

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # 1.0.0(2026-09-20)에서 new_decoderv1 이 사라져 9/21부터 수집이 멈췄다. 코드가 0.1.x API 를 쓰므로 고정한다
        run: pip install supabase googlenewsdecoder==0.1.7

      - name: Run daily news update
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python supabase/daily_news_update.py

      - name: Generate deep-dive articles
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python supabase/generate_deepdive.py
